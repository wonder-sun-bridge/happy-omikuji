
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日のハッピーおみくじ | Wonder Sun Bridge</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#fff8dd,#eee3cd);font-family:'BIZ UDPGothic','Yu Gothic',sans-serif;color:#65432e;padding:24px}
main{width:min(100%,460px);text-align:center;background:#fffdf5;border:1px solid #c9a66a;border-radius:24px;padding:28px 22px;box-shadow:0 12px 40px #79553520}
small{letter-spacing:.13em;color:#856b42}
h1{font-size:clamp(24px,6vw,32px);margin:18px 0}
#art{height:145px;display:grid;place-items:center;font-size:82px}
#rank{font-size:34px;color:#ad463b;font-weight:bold;margin:8px}
#msg{font-size:23px;font-weight:bold;line-height:1.6}
p{line-height:1.8}
#extra{border-top:1px solid #decba5;padding:12px 0;font-size:16px}
button{display:block;width:100%;border:0;border-radius:30px;background:#a83f35;color:white;font:inherit;font-weight:bold;padding:15px;margin-top:12px;cursor:pointer}
button.secondary{background:#fffdf5;color:#795535;border:1px solid #bba176}
button:disabled{opacity:.7;cursor:wait}
footer{margin-top:24px;font-size:12px;color:#856b42}
button:focus-visible{outline:3px solid #bc9c50;outline-offset:3px}
[hidden]{display:none!important}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
@keyframes pop{
  0%{transform:scale(.3);opacity:0}
  70%{transform:scale(1.2)}
  100%{transform:scale(1);opacity:1}
}
.spinning{animation:spin .45s linear infinite}
.popping{animation:pop .5s ease-out}
@media(prefers-reduced-motion:reduce){
.spinning,.popping{animation:none}
}
</style>
</head>
<body>
<main>
<small>WONDER SUN BRIDGE</small>
<h1>今日のハッピーおみくじ</h1>
<div id="art" aria-hidden="true">🎋</div>
<section aria-live="polite">
<div id="rank"></div>
<div id="msg">今日のあなたに、小さな幸せを。</div>
<p id="detail">どんなメッセージが届くかな？</p>
<div id="extra" hidden></div>
</section>
<button id="draw">おみくじを引く</button>
<button id="share" class="secondary" hidden>結果を共有する</button>
<button id="copy" class="secondary" hidden>結果をコピー</button>
<p id="status" role="status"></p>
<footer>あなたの今日が、笑顔であふれますように。<br>© Wonder Sun Bridge<br>遊びとして楽しむおみくじです。</footer>
</main>
<script>
const data=[
['大吉','好奇心が、新しい扉を開く日。','小さな挑戦を楽しもう。','四つ葉のクローバー','ゴールド','🍀'],
['恋愛大吉','ときめきは、最高の美容液。','大切な人と笑顔を分かち合おう。','小さな鏡','ローズピンク','💕'],
['福吉','ま、ええか！','完璧を求めず、今日を楽しもう。','本','若草色','🌱'],
['小吉','ぼちぼち行こ。','頑張らない時間も大切に。','花の写真','ラベンダー','🌷'],
['中吉','小さな幸せはすぐそばに。','温かい飲み物でひと休み。','カップ','オレンジ','☕'],
['超大吉','ワクワクする方へ進もう！','あなたの経験は誰かの希望。','太陽の絵','黄色','☀️'],
['健康吉','身体の声に耳を傾けよう。','無理せず自分をいたわって。','タオル','白','🌿'],
['金運吉','小さな工夫が実を結ぶ。','お財布の中を整理してみよう。','財布','山吹色','👛'],
['仕事吉','一歩ずつで大丈夫。','目の前のことを一つずつ。','ペン','紺色','✏️'],
['ご縁吉','ありがとうが縁をつなぐ。','感謝の言葉を届けよう。','手紙','桃色','💌'],
['笑顔吉','笑顔は幸せのおすそ分け。','楽しい話を思い出そう。','写真','黄色','😊'],
['休息吉','休むことも立派な予定。','好きな音楽を聴こう。','クッション','水色','🎵'],
['挑戦吉','はじめの一歩に拍手！','できることから試そう。','ノート','赤','👏'],
['発見吉','いつもの道にも宝物。','小さな発見を楽しもう。','カメラ','緑','🔍'],
['友情吉','懐かしい人を思い出す日。','気軽に便りを送ってみよう。','スマホ','空色','🤝'],
['花吉','心に花を咲かせよう。','好きな花を眺めよう。','花瓶','藤色','🌸'],
['学び吉','知らないことは楽しみの種。','一つ新しいことを覚えよう。','本','青','📚'],
['旅吉','心はどこまでも自由。','行きたい場所を想像しよう。','地図','青緑','🗺️'],
['食福吉','おいしい時間を大切に。','ゆっくり味わおう。','お箸','朱色','🍵'],
['安らぎ吉','深呼吸で心に余白を。','窓の外を眺めてみよう。','ハンカチ','白','🕊️'],
['整理吉','ひとつ手放して身軽に。','小さな場所から片づけよう。','小箱','ベージュ','📦'],
['創造吉','ひらめきを形にしよう。','上手さより楽しさを。','色鉛筆','紫','🎨'],
['感謝吉','今日もありがとう。','自分にも感謝を伝えよう。','便箋','桃色','💐'],
['希望吉','明日はまだ真っ白。','楽しみを一つ考えよう。','カレンダー','白','🌈'],
['実り吉','続けてきたことに拍手。','小さな成長を喜ぼう。','果物','橙色','🍎'],
['自由吉','自分のペースで歩こう。','好きな時間を作ろう。','靴','水色','🦋'],
['勇気吉','迷いながらでも進める。','できる範囲で一歩だけ。','鍵','銀色','🔑'],
['家庭吉','温かな時間を分かち合おう。','身近な人に優しい言葉を。','マグカップ','茶色','🏡'],
['夢吉','夢に年齢制限はない。','やりたいことを書いてみよう。','手帳','金色','⭐'],
['幸せ大吉','今日という日を楽しもう。','あなたらしい笑顔で過ごしてね。','お気に入りの服','虹色','✨']
];

let last=-1;
const $=id=>document.getElementById(id);

function result(){
return '今日のハッピーおみくじ\n'+data[last][0]+'\n'+data[last][1]+'\n'+data[last][2]+'\nラッキーアイテム：'+data[last][3]+'\nラッキーカラー：'+data[last][4]+'\nWonder Sun Bridge'
}

$('draw').onclick=()=>{
$('draw').disabled=true;
$('draw').textContent='ぐるぐる抽選中…';
$('rank').textContent='';
$('msg').textContent='何が出るかな？';
$('detail').textContent='もう少し待ってね。';
$('art').textContent='🎋';
$('art').className='spinning';
$('extra').hidden=true;
$('copy').hidden=true;
$('share').hidden=true;
$('status').textContent='';

setTimeout(()=>{
let i;
do{i=Math.floor(Math.random()*data.length)}while(i===last);
last=i;
const [r,m,d,item,c,e]=data[i];
$('rank').textContent=r;
$('msg').textContent=m;
$('detail').textContent=d;
$('art').textContent=e;
$('art').className='popping';
$('extra').textContent='ラッキーアイテム：'+item+'　／　ラッキーカラー：'+c;
$('extra').hidden=false;
$('copy').hidden=false;
$('share').hidden=!navigator.share;
$('draw').textContent='もう一度引く';
$('draw').disabled=false;
},4000);
};

$('copy').onclick=async()=>{
try{
await navigator.clipboard.writeText(result());
$('status').textContent='コピーしました。LINEなどに貼り付けてね。'
}catch{
window.prompt('結果をコピーしてください',result())
}
};

$('share').onclick=async()=>{
try{
await navigator.share({text:result()})
}catch(e){
if(e.name!=='AbortError')$('status').textContent='共有できませんでした。コピーをお試しください。'
}
};
</script>
</body>
</html>
